server {
	listen 80;
	listen [::]:80;
	server_name adstrikex.com www.adstrikex.com;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name adstrikex.com www.adstrikex.com;

	ssl_certificate     /etc/letsencrypt/live/adstrikex.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/adstrikex.com/privkey.pem;

	root /var/www/html;
	index index.php index.html;
	client_max_body_size 64m;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_pass wordpress:9000;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTPS $http_x_forwarded_proto;
		fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
		fastcgi_read_timeout 300;
	}

	location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2)$ {
		expires max;
		log_not_found off;
	}
}