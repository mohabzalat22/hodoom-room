services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-badr}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-P@ssw0rd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: .
    image: badr-wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-badr}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-P@ssw0rd}
    volumes:
      - wp_data:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads

  nginx:
    build:
      context: ./nginx
    image: badr-nginx:latest
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
      - wp_uploads:/var/www/html/wp-content/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  db_data:
  wp_data:
  wp_uploads:
